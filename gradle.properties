# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.219
loader_version_range=[1,)

# Copycats+ dependency
# Find latest at: https://modrinth.com/mod/copycats-plus/versions?g=1.21.1&l=neoforge
copycats_version=2.2.1+mc1.21.1-neoforge
copycats_version_range=[2,)

## Mod Properties
mod_id=copycatplusadditions
mod_name=Copycats+ Additions
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.agent772
mod_authors=Agent772
mod_description=Adds extra block variants to Copycats+, starting with vertical slope layers.

# Release Helper Properties
# Fill these in once the mod is published
curseforge_project_id=
modrinth_project_id=
curseforge_copycats_mod_slug=copycats-plus
