# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.230
loader_version_range=[1,)

# Copycats+ dependency - value is the Modrinth version ID (not the version
# number; version numbers contain '+', which Gradle treats as a dynamic-version
# wildcard in a maven coordinate).
# kecZ0sl7 = copycats 3.0.4+mc.1.21.1-neoforge  (NeoForge, MC 1.21.1)
# Find latest at: https://modrinth.com/mod/copycats/versions?g=1.21.1&l=neoforge
copycats_version=kecZ0sl7
copycats_version_range=[3.0.4,3.0.5)

# Create dependency - value is the Modrinth version ID. Required on the compile
# classpath because Copycats+' blocks extend Create base types (IBE, IWrenchable,
# ProperWaterloggedBlock, ...); Create itself is pulled in at runtime by Copycats+.
create_version=6.0.10+mc1.21.1

jei_version=19.21.0.247
jade_version=15.10.3+neoforge

## Mod Properties
mod_id=copycatplusadditions
mod_name=Copycats+ Additions
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.agent772
mod_authors=Agent772
mod_description=Adds extra copycat block variants to Copycats+: corner slopes, layered corner slopes, and wall-mountable slope layers.

# Release Helper Properties
# Fill these in once the mod is published
curseforge_project_id=1642117
modrinth_project_id=VlyXK1Jp
curseforge_copycats_mod_slug=copycats
