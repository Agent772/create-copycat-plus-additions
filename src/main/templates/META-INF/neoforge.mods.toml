modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

issueTrackerURL="https://github.com/Agent772/Copycats-Plus-Additions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="copycats"
    type="required"
    versionRange="${copycats_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependency (issue #27): when Sable Beyond is installed, copycat mass in
# Sable physics reflects the mimicked material. Sable itself comes transitively
# (it is a required dependency of Sable Beyond).
[[dependencies.${mod_id}]]
    modId="sable_beyond"
    type="optional"
    versionRange="${sable_beyond_version_range}"
    ordering="AFTER"
    side="BOTH"
